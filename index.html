<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <meta name="description" content="Pokédex interactiva con búsqueda, filtros por tipo, generaciones, estadísticas y más. Potenciada por PokéAPI.">
  <meta name="theme-color" content="#dc0a2d">
  <title>Pokédex · Explorador de Pokémon</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Top loading progress bar -->
  <div id="progressBar"></div>

  <!-- Floating background decoration -->
  <div class="bg-balls" aria-hidden="true"></div>

  <div class="page-wrapper">

    <!-- ========== HEADER ========== -->
    <header class="pokedex-header" role="banner">
      <div class="header-left">
        <h1>
          <span class="logo-badge">⚡</span> Pokédex
        </h1>
      </div>

      <div class="header-controls">
        <!-- Search -->
        <div class="search-box" role="search">
          <input
            type="text"
            id="searchInput"
            placeholder="Nombre o Nº"
            aria-label="Buscar Pokémon por nombre o número"
            autocomplete="off"
          >
          <button id="searchBtn" class="btn-search" aria-label="Buscar">Buscar</button>
        </div>

        <!-- Surprise Me -->
        <button id="surpriseBtn" class="btn-icon" title="¡Sorpréndeme! Pokémon aleatorio" aria-label="Pokémon sorpresa">
          🎲
        </button>

        <!-- Dark Mode Toggle -->
        <button id="darkModeBtn" class="btn-icon" title="Cambiar modo oscuro/claro" aria-label="Cambiar tema">
          🌙
        </button>

        <!-- Games Button -->
        <button id="gamesBtn" class="btn-games-header" title="Minijuegos Pokémon" aria-label="Minijuegos Pokémon">
          <span class="btn-games-icon">🎮</span>
          <span class="btn-games-text">Jugar</span>
        </button>
      </div>
    </header>

    <!-- ========== FILTER BAR ========== -->
    <div class="filter-bar" role="toolbar" aria-label="Filtros de Pokémon">
      <span class="filter-bar-label">Gen:</span>
      <select id="genSelect" class="gen-select" aria-label="Seleccionar generación"></select>

      <span class="filter-bar-label">Tipo:</span>
      <div id="typeFilters" class="type-filters" role="group" aria-label="Filtrar por tipo"></div>

      <span id="resultCounter" class="result-counter">0 Pokémon</span>
    </div>

    <!-- ========== STATUS / LOADER ========== -->
    <div id="statusContainer" class="status-msg" style="display:none;" role="alert" aria-live="polite"></div>

    <div id="loaderWrapper" class="loader-wrapper" style="display:none;" role="status" aria-label="Cargando">
      <div class="loader"></div>
      <span class="loader-text">Cargando Pokémon…</span>
    </div>

    <!-- ========== GRID ========== -->
    <main id="pokedexGrid" class="pokedex-grid" aria-label="Lista de Pokémon"></main>

  </div><!-- end .page-wrapper -->

  <!-- ========== FAVORITES TAB ========== -->
  <aside class="fav-tab" aria-label="Favoritos">
    <button id="showFavsBtn" class="fav-tab-btn" title="Ver mis favoritos">
      ❤️ Favs
      <span id="favCount">0</span>
    </button>
  </aside>

  <!-- ========== POKEMON DETAIL MODAL ========== -->
  <div id="modalOverlay" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-label="Detalle del Pokémon">
    <div id="modalCard" class="modal-card"></div>
  </div>

  <!-- ========== GAMES MODAL ========== -->
  <div id="gameOverlay" class="game-overlay" style="display:none;" role="dialog" aria-modal="true" aria-label="Minijuegos">
    <div id="gameModal" class="game-modal"></div>
  </div>

  <!-- ========== FLOATING GAMES BUTTON ========== -->
  <button class="btn-games" id="gamesBtnFloat" aria-label="Abrir minijuegos">
    🎮 Jugar
  </button>

  <script src="js/app.js"></script>
</body>
</html>
